name: CERBERUS engineering tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q 01_MOSS_KYVRAEL 02_ARKHE 03_CERBERUS_CORE 05_TRADING 06_LOTOFACIL 07_ROBOTICA 08_PROMETHEUS 09_HARDWARE 11_MODELOS_IA 12_BACKUPS tests tools
      - name: Regression suite
        run: python tools/test_engineering.py
      - name: Publication hygiene
        run: python tools/check_publication.py
      - name: Control Plane browser JavaScript
        run: node --check 03_CERBERUS_CORE/control_plane.js
      - name: Browser JavaScript syntax check
        run: node --check 01_MOSS_KYVRAEL/web/app.js
      - name: Reference program (not RTL)
        run: python 09_HARDWARE/RV32I_TRACE/tools/verify_reference.py
      - name: Robotics static model
        run: python 07_ROBOTICA/calcular.py --mass-kg 2 --lever-m 0.2 --gear-ratio 10 --efficiency 0.6
  hdl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: ALU testbench
        run: bash 09_HARDWARE/RV32I_TRACE/sim/test_alu_linux.sh
      - name: RV32I core testbench
        run: bash 09_HARDWARE/RV32I_TRACE/sim/test_core_linux.sh
  windows-python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check on Windows
        run: python -m compileall -q 01_MOSS_KYVRAEL 02_ARKHE 03_CERBERUS_CORE 05_TRADING 06_LOTOFACIL 07_ROBOTICA 08_PROMETHEUS 09_HARDWARE 11_MODELOS_IA 12_BACKUPS tests tools
      - name: Python regression suite on Windows
        run: python tools/test_engineering.py
      - name: MOSS Lab CLI on Windows
        shell: cmd
        run: |
          cd 01_MOSS_KYVRAEL
          ABRIR_MOSS_LAB.bat status
